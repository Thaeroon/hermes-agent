replicaCount: 1

persistence:
  enabled: true
  size: 5Gi
  accessModes:
    - ReadWriteOnce
  mountPath: /opt/data

bootstrap:
  enabled: true
  overwrite: false

config:
  model:
    default: gpt-4o-mini
    provider: openai-api

  terminal:
    backend: local

  agent:
    gateway_timeout: 1800

env:
  CRAWL4AI_URL: "http://crawl4ai:11235"
  SEARXNG_URL: "http://searxng-http:8080"

extraEnvFrom:
  # - secretRef:
  #     name: hermes-git

  - secretRef:
      name: hermes-env

  - secretRef:
      name: searxng-secret

  - secretRef:
      name: crawl4ai-secret

service:
  enabled: false

ingress:
  enabled: false

httpRoute:
  enabled: false

networkPolicy:
  enabled: false

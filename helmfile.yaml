values:
  - signal:
      enabled: false
  - hermes:
      enabled: true
  - zeroclaw:
      enabled: true

hooks:
  - events: ["prepare"]
    showlogs: true
    command: bash
    args:
      - -c
      - |
        set -euo pipefail
        ./scripts/create_secrets.sh

repositories:
  - name: hermes-agent
    url: https://jyje.github.io/hermes-agent-helm

  - name: kubitodev
    url: https://charts.kubito.dev

  - name: bjw-s
    url: https://bjw-s-labs.github.io/helm-charts

releases:
  - name: hermes
    namespace: hermes
    createNamespace: true
    condition: hermes.enabled
    chart: hermes-agent/hermes-agent
    version: 1.15.0
    values:
      - values/hermes.yaml.gotmpl
    hooks:
      - events: ["postsync"]
        showlogs: true
        command: bash
        args:
          - -c
          - |
            set -euo pipefail

            echo "Waiting for Hermes pod..."

            kubectl -n hermes wait \
              --for=condition=Ready \
              pod \
              -l app.kubernetes.io/name=hermes-agent \
              --timeout=600s

            POD="$(kubectl -n hermes get pod \
              -l app.kubernetes.io/name=hermes-agent \
              -o jsonpath='{.items[0].metadata.name}')"

            echo "Using Hermes pod: $POD"

            kubectl -n hermes exec "$POD" -- \
              mkdir -p /tmp/bootstrap

            kubectl -n hermes cp \
              config/profiles.conf \
              "$POD:/tmp/bootstrap/profiles.conf"

            kubectl -n hermes cp \
              scripts/install_profiles.sh \
              "$POD:/tmp/bootstrap/install_profiles.sh"

            kubectl -n hermes cp \
              scripts/copy_git_dir.sh \
              "$POD:/tmp/bootstrap/copy_git_dir.sh"

            kubectl -n hermes exec "$POD" -- \
              chown -R hermes:hermes /tmp/bootstrap

            kubectl -n hermes exec "$POD" -- \
              su hermes -s /bin/bash -c /tmp/bootstrap/install_profiles.sh

  - name: searxng
    namespace: hermes
    chart: kubitodev/searxng
    version: 1.1.4
    values:
      - values/searxng.yaml

  - name: crawl4ai
    namespace: hermes
    chart: ./charts/crawl4ai
    values:
      - values/crawl4ai.yaml

  - name: signal-cli
    namespace: hermes
    condition: signal.enabled
    chart: ./charts/signal-cli
    values:
      - values/signal-cli.yaml

  - name: zeroclaw
    namespace: hermes
    createNamespace: true
    condition: zeroclaw.enabled
    chart: bjw-s/app-template
    version: ~3.7.0
    values:
      - values/zero-claw.yaml

  - name: fastcrw
    namespace: hermes
    createNamespace: true
    condition: zeroclaw.enabled
    chart: bjw-s/app-template
    version: ~3.7.0
    values:
      - values/fastcrw.yaml

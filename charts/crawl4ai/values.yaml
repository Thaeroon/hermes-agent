image:
  repository: unclecode/crawl4ai
  tag: "0.9.0"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 11235

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

shmSize: 1Gi

env: []

envFrom:
  - secretRef:
      name: crawl4ai-secret


podSecurityContext: {}

securityContext: {}

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 40
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 40
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3

nameOverride: ""
fullnameOverride: ""

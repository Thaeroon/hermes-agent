apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "signal-cli.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "signal-cli.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "signal-cli.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "signal-cli.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}

    spec:
      containers:
        - name: signal-cli
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          args:
            - daemon
            - --http
            - 0.0.0.0:8080

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          volumeMounts:
            - name: signal-data
              mountPath: /var/lib/signal-cli

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /api/v1/check
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/v1/check
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 30

      volumes:
        - name: signal-data
          persistentVolumeClaim:
            claimName: {{ include "signal-cli.fullname" . }}

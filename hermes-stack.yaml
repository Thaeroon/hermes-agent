apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  labels:
    app.kubernetes.io/name: "searxng"
    app.kubernetes.io/instance: "searxng"
    app.kubernetes.io/version: "1.0.1"
    app.kubernetes.io/managed-by: "Helm"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "searxng"
      app.kubernetes.io/instance: "searxng"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "searxng"
        app.kubernetes.io/instance: "searxng"
        app.kubernetes.io/version: "1.0.1"
        app.kubernetes.io/managed-by: "Helm"
    spec:
      serviceAccountName: searxng
      securityContext:
        {}
      containers:
        - name: searxng
          env:
            - name: GRANIAN_WORKERS
              value: "1"
            - name: GRANIAN_BLOCKING_THREADS
              value: "4"
            - name: GRANIAN_BACKPRESSURE
              value: "20"
            - name: GRANIAN_HTTP1_BUFFER_SIZE
              value: "8192"
            - name: GRANIAN_HTTP1_KEEP_ALIVE
              value: "false"
            - name: GRANIAN_LOG_LEVEL
              value: "warning"
            - name: GRANIAN_LOG_ACCESS_ENABLED
              value: "false"
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  key: SEARXNG_SECRET
                  name: searxng-secret
          securityContext:
            {}
          image: "searxng/searxng:2026.9.8-3fdc6d753"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {}
          volumeMounts:
            - mountPath: /etc/searxng/settings.yml
              name: searxng-settings
              subPath: settings.yml
              readOnly: true
            - mountPath: /etc/searxng/limiter.toml
              name: searxng-limiter
              subPath: limiter.toml
              readOnly: true
      volumes:
        - name: searxng-settings
          configMap:
            name: searxng-settings
        - name: searxng-limiter
          configMap:
            name: searxng-limiter


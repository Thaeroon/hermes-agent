# Source: hermes-agent/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-hermes-agent
  labels:
    helm.sh/chart: hermes-agent-1.13.0
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/instance: hermes
    app.kubernetes.io/version: "v2026.8.31"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  # Recreate avoids the new Pod getting stuck Pending while the old Pod still
  # holds the ReadWriteOnce PVC during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
      app.kubernetes.io/instance: hermes
  template:
    metadata:
      annotations:
        # Roll pods when config/secret content changes.
        checksum/config: 5357549d5cb4753d21b7ee10eec8398442572df1371852200a679c5e6b6e8a5c
        # secret.yaml never renders while externalSecret.enabled (see that
        # template and hermes-agent.envSecretName) - hash the ExternalSecret
        # manifest instead, so changing its target/data still rolls the Pod.
        checksum/secret: 4fcc1cfcdaee901e307b08e9b02d6287414e8d371172a8f41dbebf1be08b77da
      labels:
        app.kubernetes.io/name: hermes-agent
        app.kubernetes.io/instance: hermes
    spec:
      serviceAccountName: hermes-hermes-agent
      automountServiceAccountToken: false
      securityContext:
        {}
      initContainers:
        # Seed chart-managed files into HERMES_HOME (the writable volume). Hermes
        # merges config.yaml over its built-in defaults and also writes to its home
        # at runtime, so the ConfigMap is not mounted there read-only.
        - name: seed-config
          image: "nousresearch/hermes-agent:v2026.8.31"
          imagePullPolicy: IfNotPresent
          securityContext:
            {}
          command:
            - sh
            - -c
            - |
              set -eu
              seed() {
                dest="$1"
                source="$2"
                if [ "false" = "true" ] || [ ! -f "$dest" ]; then
                  echo "Seeding $dest (overwrite=false)"
                  cp "$source" "$dest"
                else
                  echo "Keeping existing $dest (overwrite=false)"
                fi
              }
              seed "/opt/data/config.yaml" /seed/config.yaml
              if [ -f /seed/SOUL.md ]; then
                seed "/opt/data/SOUL.md" /seed/SOUL.md
              fi
          volumeMounts:
            - name: config
              mountPath: /seed
              readOnly: true
            - name: data
              mountPath: /opt/data
      containers:
        - name: hermes-agent
          image: "nousresearch/hermes-agent:v2026.8.31"
          imagePullPolicy: IfNotPresent
          args:
            - gateway
            - run
          securityContext:
            {}
          env:
            - name: HERMES_HOME
              value: "/opt/data"
          envFrom:
            - secretRef:
                name: hermes-hermes-agent-env
            - secretRef:
                name: hermes-api
            - secretRef:
                name: searxng-secret
            - secretRef:
                name: crawl4ai-secret
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
      volumes:
        - name: config
          configMap:
            name: hermes-hermes-agent-config
        - name: data
          persistentVolumeClaim:
            claimName: hermes-hermes-agent

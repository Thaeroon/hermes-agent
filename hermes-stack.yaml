# Source: hermes-agent/templates/tests/test-hermes-doctor.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-hermes-agent-test
  labels:
    helm.sh/chart: hermes-agent-1.13.0
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/instance: hermes
    app.kubernetes.io/version: "v2026.8.31"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: test
  annotations:
    # Helm test hook: created/run by `helm test <release>`, after install.
    "helm.sh/hook": test
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
    # ArgoCD PostSync hook: also run automatically after every ArgoCD sync.
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
        app.kubernetes.io/instance: hermes
        app.kubernetes.io/component: test
    spec:
      restartPolicy: Never
      initContainers:
        # Seed the same chart-managed files into a private HERMES_HOME so
        # `hermes doctor` evaluates what the workload runs with.
        - name: seed-config
          image: "nousresearch/hermes-agent:v2026.8.31"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              cp /seed/config.yaml /opt/data/config.yaml
              if [ -f /seed/SOUL.md ]; then
                cp /seed/SOUL.md /opt/data/SOUL.md
              fi
          volumeMounts:
            - name: config
              mountPath: /seed
              readOnly: true
            - name: data
              mountPath: /opt/data
      containers:
        - name: hermes-doctor
          image: "nousresearch/hermes-agent:v2026.8.31"
          imagePullPolicy: IfNotPresent
          env:
            - name: HERMES_HOME
              value: "/opt/data"
          envFrom:
            - secretRef:
                name: hermes-hermes-agent-env
            - secretRef:
                name: hermes-api
            - secretRef:
                name: searxng-secret
            - secretRef:
                name: crawl4ai-secret
          command:
            - sh
            - -c
            - |
              set -eu
              echo "===================================================="
              echo " hermes-agent install test (doctor-style)"
              echo "===================================================="

              echo "[1/4] hermes CLI version"
              hermes --version

              echo "[2/4] seeded config.yaml present in HERMES_HOME"
              if [ -f "$HERMES_HOME/config.yaml" ]; then
                echo "  OK: $HERMES_HOME/config.yaml"
              else
                echo "  FAIL: $HERMES_HOME/config.yaml missing"; exit 1
              fi

              echo "[3/4] docker availability (local backend -> informational)"
              if command -v docker >/dev/null 2>&1; then
                docker version 2>/dev/null && echo "  docker daemon reachable" \
                  || echo "  docker CLI present, no daemon (expected: local backend)"
              else
                echo "  docker not installed (expected: terminal.backend=local)"
              fi

              echo "[4/4] hermes doctor (timeout 120s)"
              if [ "false" = "true" ]; then
                timeout -k 10 120 hermes doctor
              else
                timeout -k 10 120 hermes doctor \
                  || echo "  doctor reported issues (non-fatal: tests.doctorStrict=false)"
              fi

              echo "===================================================="
              echo " ALL REQUIRED CHECKS PASSED"
              echo "===================================================="
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
      volumes:
        - name: config
          configMap:
            name: hermes-hermes-agent-config
        - name: data
          emptyDir: {}


